# Checks that run on `git commit` once you have run `pre-commit install`.
# Run them on demand with `pre-commit run --all-files`.
#
# Data files (CSV, Excel, GeoJSON, PDF) are never rewritten by these hooks:
# whitespace and end-of-file fixes apply only to code and documentation.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        types_or: [python, markdown, yaml, sql]
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
        types_or: [python, markdown, yaml, sql]
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=51200]      # 50 MB; see "Rules for data files" in CONTRIBUTING.md
      - id: check-merge-conflict
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
      - id: isort
        args: ["--profile", "black"]
